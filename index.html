<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gångertabell-racet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: compact single column; all 20 tasks in a grid so the whole test fits on one screen */
:root {
  --bg: #eef3f8;
  --card: #ffffff;
  --fg: #1d2a3a;
  --muted: #5d6f85;
  --line: #d6e0eb;
  --accent: #2f6fdf;
  --accent-ink: #ffffff;
  --good: #1f9d63;
  --bad: #d64545;
  --gold: #e8a317;
  --display: "Fredoka", "Nunito", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a24; --card: #19242f; --fg: #e8eef5; --muted: #93a4b8; --line: #2b3a4a;
    --accent: #5b95f5; --accent-ink: #0b1420; --good: #3ccf8a; --bad: #f07272; --gold: #f2bd45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a24; --card: #19242f; --fg: #e8eef5; --muted: #93a4b8; --line: #2b3a4a;
  --accent: #5b95f5; --accent-ink: #0b1420; --good: #3ccf8a; --bad: #f07272; --gold: #f2bd45;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
main { width: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.4rem; margin: 0; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 0; font-size: .9rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
input { font: inherit; color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
input:focus { border-color: var(--accent); outline: none; }
.btn {
  font-family: var(--display); font-weight: 600; font-size: 1.05rem;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  padding: 10px 18px; cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--muted); font-size: .9rem; padding: 4px 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row input { flex: 1 1 160px; min-width: 0; }
.note { color: var(--muted); font-size: .85rem; margin: 0; }

/* task grid */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); } }
.q {
  display: grid; grid-template-columns: 1fr 3.4em; align-items: center; gap: 6px;
  padding: 6px 6px 6px 10px; border: 2px solid var(--line); border-radius: 10px;
  font-family: var(--display); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums;
}
.q .eq { white-space: nowrap; }
.q .op { color: var(--accent); }
.q input { width: 100%; padding: 4px 6px; text-align: center; font-family: var(--display); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.q .fix { grid-column: 1 / -1; font-size: .8rem; font-family: var(--body); font-weight: 700; color: var(--bad); margin-top: -2px; }
.q.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
.q.ok input { border-color: var(--good); }
.q.no { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.q.no input { border-color: var(--bad); text-decoration: line-through; }
.bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* result */
.res { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { background: var(--bg); border-radius: 10px; padding: 6px 12px; font-variant-numeric: tabular-nums; }
.pill b { font-family: var(--display); font-size: 1.15rem; }
.record { font-family: var(--display); font-weight: 600; color: var(--gold); }

/* scores */
.scores h2 { font-family: var(--display); font-size: 1rem; margin: 0; display: flex; justify-content: space-between; align-items: center; }
.scores ol { list-style: none; margin: 0; padding: 0; }
.scores li { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.scores li:first-child { border-top: 0; }
.rank { font-family: var(--display); font-weight: 700; color: var(--muted); }
.scores li:first-child .rank { color: var(--gold); }
.who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who small { color: var(--muted); }
.t { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
.scores li.mine { background: color-mix(in srgb, var(--gold) 16%, transparent); border-radius: 6px; padding-inline: 6px; margin-inline: -6px; }
.empty { color: var(--muted); margin: 0; font-size: .9rem; }
</style>

<main>
  <header>
    <h1>Gångertabell-<span>racet</span></h1>
    <p class="sub">20 tal upp till 10×10</p>
  </header>

  <!-- START -->
  <section id="start" class="card">
    <div class="row">
      <input type="text" id="name" maxlength="16" placeholder="Ditt namn" autocomplete="off" aria-label="Ditt namn">
      <button class="btn" id="go">Starta</button>
    </div>
    <p class="note">Tryck Enter för att hoppa till nästa tal. Klockan går i bakgrunden.</p>
  </section>

  <!-- GAME + RESULT -->
  <section id="game" class="card" hidden>
    <div id="res" class="res" hidden>
      <span class="pill"><b id="rCorrect">0</b> / 20 rätt</span>
      <span class="pill"><b id="rTime">0,0 s</b></span>
      <span class="record" id="record" hidden>Nytt rekord!</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="bottom">
      <button class="btn ghost" id="quit">Avbryt</button>
      <button class="btn" id="done">Klar</button>
    </div>
  </section>

  <section class="card scores">
    <h2>Topplista</h2>
    <ol id="list"></ol>
    <p class="empty" id="empty">Inga resultat än. Bli först på listan!</p>
  </section>
</main>

<script>
(() => {
  const N = 20, KEY = "gangertabell-scores-v3", NAMEKEY = "gangertabell-name";
  // Gemensam topplista i Supabase. Publishable key är avsedd att ligga publikt; RLS tillåter bara läsa + lägga till.
  const SB = "https://qgkplqqtrmckgjmdsove.supabase.co/rest/v1/scores", SBKEY = "sb_publishable_x_t_yU9DIk3bQ7ghtwxROA_P2RYR70m";
  const sbHeaders = { apikey: SBKEY, "Content-Type": "application/json" };
  const $ = id => document.getElementById(id);
  const fmt = s => s.toFixed(1).replace(".", ",") + " s";
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const cached = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const cache = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch {} };
  const day = iso => new Date(iso).toLocaleDateString("sv-SE", { day: "numeric", month: "short" });
  let scores = cached();

  async function fetchScores() {
    try {
      const r = await fetch(SB + "?select=id,name,correct,time,created_at&order=correct.desc,time.asc,created_at.asc&limit=10", { headers: sbHeaders });
      if (!r.ok) throw new Error(r.status);
      scores = await r.json(); cache(scores);
    } catch {}
    return scores;
  }

  async function postScore(entry) {
    try {
      const r = await fetch(SB, { method: "POST", headers: { ...sbHeaders, Prefer: "return=representation" }, body: JSON.stringify(entry) });
      if (!r.ok) throw new Error(r.status);
      return (await r.json())[0].id;
    } catch { return null; }
  }
  try { $("name").value = localStorage.getItem(NAMEKEY) || ""; } catch {}

  let tasks = [], t0 = 0, playing = false, lastId = null;

  function makeTasks() {
    const pool = [];
    for (let a = 2; a <= 10; a++) for (let b = 2; b <= 10; b++) pool.push([a, b]);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const out = pool.slice(0, N - 2);
    for (let k = 0; k < 2; k++) {
      const a = Math.random() < .5 ? 1 : 10, b = 1 + Math.floor(Math.random() * 10);
      out.splice(Math.floor(Math.random() * out.length), 0, Math.random() < .5 ? [a, b] : [b, a]);
    }
    return out;
  }

  function renderGrid() {
    $("grid").innerHTML = tasks.map(([a, b], i) => `
      <div class="q" id="q${i}">
        <span class="eq">${a} <span class="op">×</span> ${b} =</span>
        <input id="a${i}" type="text" inputmode="numeric" enterkeyhint="${i < N - 1 ? "next" : "done"}" maxlength="3" aria-label="${a} gånger ${b}" autocomplete="off">
      </div>`).join("");
    tasks.forEach((_, i) => {
      $("a" + i).addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          if (i < N - 1) $("a" + (i + 1)).focus();
          else finish();
        }
      });
      $("a" + i).addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, ""); });
    });
  }

  function start() {
    try { localStorage.setItem(NAMEKEY, $("name").value.trim()); } catch {}
    tasks = makeTasks(); lastId = null; playing = true;
    renderGrid();
    $("res").hidden = true; $("done").hidden = false; $("quit").textContent = "Avbryt";
    $("start").hidden = true; $("game").hidden = false;
    fetchScores().then(renderScores);
    $("a0").focus();
    t0 = performance.now();
  }

  async function finish() {
    if (!playing) return;
    playing = false;
    const time = (performance.now() - t0) / 1000;
    let correct = 0;
    tasks.forEach(([a, b], i) => {
      const inp = $("a" + i), q = $("q" + i), ok = parseInt(inp.value, 10) === a * b;
      inp.readOnly = true;
      q.classList.add(ok ? "ok" : "no");
      if (ok) correct++;
      else q.insertAdjacentHTML("beforeend", `<span class="fix">Rätt svar: ${a * b}</span>`);
    });

    $("rCorrect").textContent = correct;
    $("rTime").textContent = fmt(time);
    $("record").hidden = true;
    $("res").hidden = false;
    $("done").hidden = true;
    $("quit").textContent = "Kör igen";
    if (document.activeElement) document.activeElement.blur();

    const better = (x, y) => y.correct - x.correct || x.time - y.time;
    const prevBest = (await fetchScores())[0];
    const entry = { name: $("name").value.trim(), correct, time: Math.round(time * 10) / 10 };
    $("record").hidden = !(!prevBest || better(entry, prevBest) < 0);
    lastId = await postScore(entry);
    await fetchScores();
    renderScores();
  }

  function renderScores() {
    const l = scores;
    $("empty").hidden = l.length > 0;
    $("list").innerHTML = l.map((s, i) => `
      <li class="${s.id === lastId ? "mine" : ""}">
        <span class="rank">${i + 1}</span>
        <span class="who">${esc(s.name || "Okänd")} <small>${day(s.created_at)}</small></span>
        <span class="t">${s.correct}/20</span>
        <span class="t">${fmt(s.time)}</span>
      </li>`).join("");
  }

  $("go").addEventListener("click", start);
  $("name").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); start(); } });
  $("done").addEventListener("click", finish);
  $("quit").addEventListener("click", () => {
    if (!playing && !$("res").hidden) { start(); return; }
    playing = false; $("game").hidden = true; $("start").hidden = false;
  });
  renderScores();
  fetchScores().then(renderScores);
})();
</script>

</body></html>
